[package]
name = "linkedin_export"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
csv = "1.4.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "linkedin-build"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
